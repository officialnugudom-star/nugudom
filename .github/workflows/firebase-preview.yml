  name: Deploy preview channel on PR

  # Every PR gets its own throwaway preview URL. The Firebase Hosting action
  # omits `channelId`, which makes it create a per-PR preview channel and post
  # the URL as a comment on the PR. Pushing more commits to the same PR
  # redeploys to the same preview channel.
  #
  # Only runs for PRs from the same repository (not from forks) so the secret
  # isn't leaked to untrusted contributors.

  on:
    pull_request:
      branches:
        - main

  jobs:
    preview:
      if: github.event.pull_request.head.repo.full_name == github.repository
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: FirebaseExtended/action-hosting-deploy@v0
          with:
            repoToken: ${{ secrets.GITHUB_TOKEN }}
            firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            projectId: nuguu-1956e
            expires: 7d
