name: Spotify weekly stats sync

on:
  schedule:
    # Mondays 13:00 UTC = 06:00 PT, after Spotify's nightly stats roll over.
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      query_hash:
        description: 'Optional: override the Spotify persistedQuery hash (use when auto-discovery breaks)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Run Spotify sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SPOTIFY_QUERY_HASH: ${{ inputs.query_hash }}
        run: python scripts/spotify_sync.py
